<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Takeoff Line Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <div class="brand">Takeoff <span>Line Review</span></div>
  <select id="sampleSel"><option value="">Open sample plan…</option></select>
  <input id="pathInput" placeholder="…or paste a PDF path" spellcheck="false">
  <button id="openBtn">Open</button>
  <div id="docName" class="doc-name"></div>
  <select id="pageSel" hidden></select>
  <button id="detectBtn" hidden>Detect lines</button>
  <div id="status" class="status"></div>
  <button id="aiBtn" hidden>AI analyze</button>
  <button id="legendBtn" title="Read a dedicated LEGEND sheet and use its trade names as label suggestions">Legend sheet</button>
  <input id="legendPath" type="hidden">
</header>
<div id="aiBanner" class="ai-banner" hidden></div>
<main>
  <aside id="sidebar">
    <div id="colorChips" class="color-chips"></div>
    <div id="legendBox" class="legend-box" hidden></div>
    <div class="side-head">
      <h2>Detected line styles</h2>
      <div class="side-actions">
        <button id="allBtn" class="mini">all</button>
        <button id="noneBtn" class="mini">none</button>
      </div>
    </div>
    <div id="styleList" class="style-list"></div>
    <div class="takeoff-head"><h2>Itemized takeoff</h2></div>
    <div id="itemized" class="itemized"></div>
    <div class="approve-bar">
      <button id="approveBtn" disabled>Approve &amp; export</button>
    </div>
    <div class="links-bar">
      <a id="dlLink" hidden download>elements.json</a>
      <a id="reportLink" hidden>Report PDF (all approved pages)</a>
    </div>
  </aside>
  <section id="stage">
    <canvas id="view"></canvas>
    <div id="hint" class="hint">Open a plan to begin — scroll to zoom, drag to pan</div>
    <div id="selBar" class="sel-bar" hidden>
      <span id="selInfo"></span>
      <button id="splitBtn" title="Cut this line in two at the clicked spot — then delete the piece you don't want (e.g. over a door opening)">✂ Split here</button>
      <button id="extendBtn" title="Click a point on the sheet to extend this line's nearest end to it">⟶ Extend</button>
      <button id="sepBtn" title="Give this one line its own name and price row, separate from its group">⬚ Separate</button>
      <button id="removeBtn">Remove (⌫)</button>
    </div>
    <div class="toolkit">
      <button id="measureBtn" title="Click two or more points on the sheet to measure footage at the detected scale">📏 Measure</button>
      <span id="measureInfo" hidden></span>
    </div>
    <button id="restoreBtn" class="restore-btn" hidden>Reset edits</button>
  </section>
</main>
<datalist id="legendVocab"></datalist>
<script src="app.js?v=3"></script>
</body>
</html>
