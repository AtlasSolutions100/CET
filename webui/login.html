<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in &middot; CET</title>
<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=1" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/favicon-180.png?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Self-contained on purpose. Every asset this page needs has to be
     reachable BEFORE anyone is signed in, so each extra file would be another
     path the auth middleware has to let through. One file, no dependencies. -->
<style>
  :root {
    --bg: #0d1013; --panel: #1a1d1f; --line: #343a3e; --text: #ecece8;
    --dim: #a3a9a6; --accent: #f0862c; --accent-ink: #1c0d02; --field: #262b2e;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background-color: var(--bg);
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    font: 14px/1.5 "IBM Plex Sans", "Segoe UI", -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  .beta {
    padding: 5px 12px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    font-family: var(--mono); color: #241a03; background: #e7b83a; border-bottom: 1px solid #b8901f;
    text-align: center;
  }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 28px; position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: repeating-linear-gradient(135deg, rgba(240,134,44,.55) 0 7px, transparent 7px 14px); }
  .brand {
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 24px; font-weight: 700;
    letter-spacing: .10em; margin-bottom: 2px;
  }
  .brand::before { content: ""; display: inline-block; width: 12px; height: 12px; background: var(--accent); margin-right: 10px; }
  .brand-sub {
    display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    font-weight: 500; margin-top: 4px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 22px 0 18px; }
  label {
    display: block; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 5px;
  }
  input {
    width: 100%; padding: 9px 11px; margin-bottom: 15px; font-size: 14px;
    color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 4px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 4px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button[disabled] { opacity: .6; cursor: default; }
  .err {
    display: none; margin: 0 0 14px; padding: 9px 11px; font-size: 13px;
    color: #ffd9d3; background: #3a1c17; border: 1px solid #6b2f26;
    border-radius: 6px;
  }
  .err.show { display: block; }
  .foot { margin-top: 18px; font-size: 11.5px; color: var(--dim); line-height: 1.6; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
<div class="beta">BETA - CET is still being refined. Automated detection can be wrong, so check every quantity against the drawings.</div>
<main>
  <div class="card">
    <div class="brand">CET<span class="brand-sub">GENERAL CONSTRUCTION &middot; WORK OPTIONAL</span></div>
    <h1>Sign in</h1>
    <p class="err" id="err"></p>
    <form id="f" autocomplete="on">
      <label for="u">Email</label>
      <!-- type=email would block a bare username on a box with no users.json,
           where any name plus the site password is valid. -->
      <input id="u" name="username" type="text" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password"
             autocomplete="current-password" required>
      <button id="go" type="submit">Sign in</button>
    </form>
    <p class="foot">Trouble signing in? Ask Koby or Christian to reset it.<br>
      By signing in you accept the <a href="/terms">Terms of Service</a>
      and <a href="/privacy">Privacy Policy</a>.</p>
  </div>
</main>
<script>
  const f = document.getElementById("f");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const show = (m) => { err.textContent = m; err.classList.add("show"); };

  f.onsubmit = async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    go.disabled = true;
    go.textContent = "Signing in…";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("u").value,
          password: document.getElementById("p").value,
        }),
      });
      if (r.ok) {
        // Whatever page they were sent here from, else the app root.
        const to = new URLSearchParams(location.search).get("next") || "/";
        // Keep the fragment. A link from Bid Sniper is <root>/#bid=<id> (or
        // #job=<id>); the server never sees a fragment, so the redirect to
        // /login?next=/ carried it here on the login URL, and dropping it
        // would land the person on Projects with the hand-off lost.
        const dest = to.startsWith("/") ? to : "/";
        location.href = dest.includes("#") ? dest : dest + (location.hash || "");
        return;
      }
      const j = await r.json().catch(() => ({}));
      show(j.detail || `Could not sign in (${r.status})`);
    } catch (e) {
      show("Could not reach the server. Check your connection and try again.");
    }
    go.disabled = false;
    go.textContent = "Sign in";
  };
  document.getElementById("u").focus();
</script>
</body>
</html>
