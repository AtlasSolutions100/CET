<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CORE Takeoff">
  <title>CORE Takeoff</title>
  <desc>A faceted letter C in green, cut by two thin diagonal gaps.</desc>
  <defs>
    <linearGradient id="fc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#0f4d34"/>
      <stop offset="0.30" stop-color="#0f4d34"/>
      <stop offset="0.30" stop-color="#1a8a59"/>
      <stop offset="0.58" stop-color="#1a8a59"/>
      <stop offset="0.58" stop-color="#2cb478"/>
      <stop offset="0.82" stop-color="#2cb478"/>
      <stop offset="0.82" stop-color="#5cdca6"/>
      <stop offset="1"    stop-color="#5cdca6"/>
    </linearGradient>
    <mask id="cmask">
      <circle cx="16" cy="16" r="15" fill="#fff"/>
      <circle cx="16" cy="16" r="6.6" fill="#000"/>
      <rect x="17.4" y="12.9" width="16" height="6.2" fill="#000"/>
      <line x1="-3" y1="20" x2="20" y2="-3" stroke="#000" stroke-width="1.7"/>
      <line x1="3" y1="35" x2="35" y2="3" stroke="#000" stroke-width="1.7"/>
    </mask>
  </defs>
  <rect width="32" height="32" fill="url(#fc)" mask="url(#cmask)"/>
</svg>
