<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CORE Takeoff">
  <title>CORE Takeoff</title>
  <desc>A green sphere fragmenting into vertical slices.</desc>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#125639"/>
      <stop offset="0.5" stop-color="#3aa073"/>
      <stop offset="1" stop-color="#93dcba"/>
    </linearGradient>
    <mask id="cut">
      <circle cx="16" cy="16" r="14" fill="#fff"/>
      <ellipse cx="9.4"  cy="16" rx="0.8" ry="15.5" fill="#000"/>
      <ellipse cx="13.0" cy="16" rx="0.8" ry="15.5" fill="#000"/>
      <ellipse cx="16.6" cy="16" rx="0.8" ry="15.5" fill="#000"/>
      <ellipse cx="20.2" cy="16" rx="0.8" ry="15.5" fill="#000"/>
      <ellipse cx="23.8" cy="16" rx="0.8" ry="15.5" fill="#000"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="14" fill="url(#cg)" mask="url(#cut)"/>
</svg>
