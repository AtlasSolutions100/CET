# CET (general construction), hosted on the SHARED workoptional box.
#
#   cp .env.example .env   # keys; no SITE_HOST here - Caddy is core's
#   docker compose build   # or: TAG=v1.0.0 docker compose pull app
#   docker compose up -d
#
# This box already runs core (takeoff-app-1 + takeoff-caddy-1), portal and
# bisonlawn behind ONE Caddy - core's - which imports a site block per app
# from ~/takeoff/caddy-sites and reaches each app over the external
# `web-proxy` network. So this stack is the app only: no Caddy, no ports on
# the host; deploy/construction.caddy is the site block. For a box of its
# own, docker-compose.standalone.yml is the full stack with Caddy.
#
# ONE app container, on purpose. JOBS lives in process memory and the
# artifacts live on the mounted volume, so a second replica would hold half
# the state. Scale the box up, never out.

services:
  app:
    image: ghcr.io/atlassolutions100/cet:${TAG:-latest}
    # local build: docker compose build
    build: .
    # the name core's Caddy proxies to (deploy/construction.caddy)
    container_name: cet-app
    restart: unless-stopped
    environment:
      TAKEOFF_HOSTED: "1"
      # WHICH PRODUCT. construction hides the excavation calculators and
      # names the product CET; Bid Sniper stays off unless BID_SNIPER_URL
      # is set on purpose.
      TAKEOFF_PRODUCT: construction
      TAKEOFF_JOBS_DIR: /data/jobs
      # Two workers and 8 GB by default: core on the same box already
      # reserves four workers and 24 GB of the 31.
      TAKEOFF_WORKERS: ${TAKEOFF_WORKERS:-2}
      TAKEOFF_PAGE_BUDGET_S: ${TAKEOFF_PAGE_BUDGET_S:-900}
      TAKEOFF_UI_PASSWORD: ${TAKEOFF_UI_PASSWORD:-}
      TAKEOFF_LLM_MODEL: ${TAKEOFF_LLM_MODEL:-grok-4-fast-reasoning}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      # Named, never anonymous: the detection cache and users.json live here.
      - cet-jobs:/data/jobs
    expose:
      - "8100"
    mem_limit: ${APP_MEM_LIMIT:-8g}
    shm_size: "1g"
    networks:
      - default
      - web-proxy

networks:
  web-proxy:
    # Created once by hand on the box (`docker network create web-proxy`);
    # external so tearing this stack down cannot take core's network away.
    external: true

volumes:
  cet-jobs:
